<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Patient Information</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="navbar">

    <div class="nav-brand">
        🏥 HealthTriage
    </div>

    <div class="nav-right">

        <span id="welcomeUser"></span>

        <button
            class="logout-btn"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>


<main class="main-container">

    <div class="page-heading">

        <span class="step">
            STEP 1 OF 3
        </span>

        <h1>Patient Information</h1>

        <p>
            Enter basic information before starting the assessment.
        </p>

    </div>


    <div class="form-card">

        <form id="patientForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>Full Name *</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Age *</label>

                    <input
                        type="number"
                        id="age"
                        min="1"
                        max="120"
                        placeholder="Age"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Gender *</label>

                    <select id="gender" required>

                        <option value="">
                            Select gender
                        </option>

                        <option value="Male">
                            Male
                        </option>

                        <option value="Female">
                            Female
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="form-group full">

                    <label>Location / District</label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Example: Cuttack"
                    >

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="secondary-btn"
                    onclick="logout()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Continue to Symptoms →
                </button>

            </div>

        </form>

    </div>

</main>


<script src="app.js"></script>
<script src="patient.js"></script>

</body>
</html>
